version: "3.9"

services:
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine

    ports:
      - "6379:6379"

  app:
    build: .

    depends_on:
      - postgres
      - redis

    ports:
      - "5000:5000"

    env_file:
      - .env

volumes:
  postgres_data: